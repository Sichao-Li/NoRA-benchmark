[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nora-benchmark"
version = "0.4.0"
description = "NoRA: model-independent grounded normative reasoning evaluation."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT AND CC-BY-NC-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [
  { name = "NoRA contributors" }
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "huggingface-hub>=0.30"
]

[project.optional-dependencies]
scorer = ["sentence-transformers>=3.0,<6"]
test = [
  "pytest>=8.0"
]
wordnet = [
  "nltk>=3.8"
]

[project.scripts]
nora = "nora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nora*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
nora = ["assets/*.json", "assets/*.jsonl"]
